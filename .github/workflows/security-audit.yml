name: Repository Security and Quality Audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ultramagnus23/ultramagnus23/.github/workflows/reusable-repo-audit.yml@615b18be745dd299f87e079414ff3ca93cb6095d
    permissions:
      contents: read

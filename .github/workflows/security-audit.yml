name: Repository Security and Quality Audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ultramagnus23/ultramagnus23/.github/workflows/reusable-repo-audit.yml@c2506a68e4088c67710b613d678862e42346faad
    permissions:
      contents: read

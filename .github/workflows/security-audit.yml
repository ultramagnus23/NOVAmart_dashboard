name: Repository Security and Quality Audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ultramagnus23/ultramagnus23/.github/workflows/reusable-repo-audit.yml@1fb09bf73ed7998a1b1edc16f7ca586e7f123fae
    permissions:
      contents: read

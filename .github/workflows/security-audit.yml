name: Repository Security and Quality Audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p reports
      - name: Gitleaks
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" --entrypoint gitleaks zricethezav/gitleaks:v8.30.1 git /src --redact --report-format sarif --report-path /src/reports/gitleaks.sarif --exit-code 0
      - name: Semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: docker run --rm -v "$PWD:/src" --entrypoint semgrep semgrep/semgrep:1.185.0 scan --config p/default --metrics off --exclude .git --exclude node_modules --exclude .venv --exclude dist --exclude build --sarif --output /src/reports/semgrep.sarif /src
      - name: Trivy
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" --entrypoint trivy aquasec/trivy:0.69.3 fs --scanners vuln,misconfig,secret --skip-dirs .git --skip-dirs node_modules --skip-dirs .venv --format sarif --output /src/reports/trivy.sarif /src
      - name: OSV-Scanner
        continue-on-error: true
        run: docker run --rm -v "$PWD:/src" --entrypoint osv-scanner ghcr.io/google/osv-scanner:v2.7.1 scan source -r /src --format json --output-file /src/reports/osv.json
      - name: Ruff
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.17.4
          ruff check . --exclude .git --exclude node_modules --exclude .venv --output-format json --output-file reports/ruff.json
      - name: npm audit
        continue-on-error: true
        shell: bash
        run: |
          i=0
          while IFS= read -r -d '' f; do
            d="$(dirname "$f")"
            if [[ -f "$d/package.json" ]]; then
              i=$((i+1))
              (cd "$d" && npm audit --json) > "reports/npm-audit-$i.json" || true
            fi
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' -print0)
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-audit-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
